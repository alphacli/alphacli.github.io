<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>404 — Alphacode</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' rx='5' fill='%2309090B'/%3E%3Cpath d='M5.5 5 L5.5 17 L8 17 L8 10.5 L13 17 L15.5 17 L15.5 5 L13 5 L13 11.5 L8 5 Z' fill='%23FAFAF9'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
  <style>
    :root {
      color-scheme: dark light;
      --bg: #09090B; --bg-1: #0C0C0F; --bg-2: #111114;
      --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
      --text: #FAFAFA; --text-dim: #A1A1AA; --text-mute: #71717A;
      --accent: #A78BFA; --positive: #A3E635;
      --ease: cubic-bezier(.16,1,.3,1);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FAFAF9; --bg-1: #FFFFFF; --bg-2: #F4F4F5;
        --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.14);
        --text: #09090B; --text-dim: #52525B; --text-mute: #71717A;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid; place-items: center;
      font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      overflow: hidden;
      position: relative;
    }
    .bg {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 60% 55% at 50% 40%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 40%, #000 20%, transparent 75%);
    }
    @media (prefers-color-scheme: light) {
      .bg { background-image: linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px); }
    }
    .glow {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 700px; height: 460px;
      background: radial-gradient(ellipse at center, rgba(167,139,250,.18), transparent 65%);
      filter: blur(50px);
      pointer-events: none;
    }
    .box { text-align: center; max-width: 480px; padding: 24px; position: relative; z-index: 1; }
    .brand {
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 14px; color: var(--text-dim);
      margin-bottom: 40px;
    }
    .brand svg { color: var(--text); }
    .code {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: var(--text-mute);
      padding: 5px 12px;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      background: var(--bg-1);
      margin-bottom: 20px;
    }
    .code .dot { width: 6px; height: 6px; border-radius: 999px; background: #FB7185; box-shadow: 0 0 8px #FB7185; flex-shrink: 0; }
    h1 {
      font-size: clamp(48px, 8vw, 72px); margin: 0 0 12px;
      letter-spacing: -.04em; font-weight: 620; line-height: 1;
      background: linear-gradient(135deg, var(--text), var(--text-dim));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { font-size: 15.5px; color: var(--text-dim); margin: 0 0 28px; line-height: 1.6; }
    .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px;
      border: 1px solid var(--text); color: var(--bg); background: var(--text);
      border-radius: 8px; font-size: 13.5px; font-weight: 500; text-decoration: none;
      transition: transform .15s var(--ease), background .15s var(--ease);
    }
    a:hover { transform: translateY(-1px); }
    a.secondary {
      background: var(--bg-2); color: var(--text); border-color: var(--line-2);
    }
    a.secondary:hover { background: var(--bg-1); border-color: var(--line-2); }
    @media (prefers-reduced-motion: reduce) { a:hover { transform: none; } }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="box">
    <a href="/" class="brand" aria-label="Alphacode home">
      <svg width="18" height="18" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect width="22" height="22" rx="5" fill="currentColor"/>
        <path d="M5.5 5 L5.5 17 L8 17 L8 10.5 L13 17 L15.5 17 L15.5 5 L13 5 L13 11.5 L8 5 Z" fill="var(--bg)"/>
      </svg>
      <span>Alphacode</span>
    </a>
    <div class="code"><span class="dot"></span>404 / route_not_found</div>
    <h1>Not found.</h1>
    <p>Whatever you were looking for isn't here. Try the home page, the docs, or the MCP guide.</p>
    <div class="links">
      <a href="/">Home</a>
      <a class="secondary" href="/docs/">Docs</a>
      <a class="secondary" href="/mcp.html">MCP</a>
    </div>
  </div>
</body>
</html>

name: Bug report
description: Report a problem with the Alphacode marketing site.
labels: ["bug", "site"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL (if relevant)
      placeholder: https://alphacli.github.io/...
  - type: select
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot / console output
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
        - label: This is a site bug, not a CLI bug (use dragonked2/alphacode for CLI issues)
          required: true

name: Feature request
description: Suggest an improvement for the Alphacode marketing site.
labels: ["enhancement", "site"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: Alternatives considered
  - type: textarea
    id: screenshots
    attributes:
      label: Mockups / references
